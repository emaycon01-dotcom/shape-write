<html><body style="margin:0">
<div class="page" style="width:794px;height:1123px;position:relative;background:#fff">
<div style="position:absolute;left:40px;top:30px;font:30px sans-serif">TOPO ABC</div>
<div style="position:absolute;left:40px;top:560px;font:30px sans-serif">MEIO XYZ</div>
<div style="position:absolute;left:40px;top:1060px;font:30px sans-serif">RODAPE 123</div>
</div>
<script type="module">
import html2canvas from '/node_modules/html2canvas-pro/dist/html2canvas-pro.esm.js';
import { jsPDF } from '/node_modules/jspdf/dist/jspdf.es.min.js';
window.run = async () => {
  const target = document.querySelector('.page');
  const width = target.offsetWidth, height = target.offsetHeight, scale = 2;
  const wPt = width*0.75, hPt = height*0.75;
  const pdf = new jsPDF({orientation:'portrait', unit:'pt', format:[wPt,hPt], compress:true});
  const parent = target.parentNode;
  const anchor = document.createComment('a');
  const viewport = document.createElement('div');
  parent.insertBefore(anchor, target);
  viewport.style.cssText = `width:${width}px;overflow:hidden;position:relative;background:#fff;margin:0;padding:0`;
  viewport.appendChild(target); parent.insertBefore(viewport, anchor);
  let top=0; const band=300;
  while(top<height){
    const sliceH=Math.min(band,height-top);
    viewport.style.height=`${sliceH}px`; target.style.marginTop=`${-top}px`;
    const c = await html2canvas(viewport,{scale,backgroundColor:'#fff',logging:false,width,height:sliceH,windowWidth:width,windowHeight:sliceH,scrollX:0,scrollY:0});
    pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',0,top*0.75,wPt,Math.min(sliceH*0.75+0.05,hPt-top*0.75),undefined,'NONE');
    top+=sliceH;
  }
  return pdf.output('datauristring');
};
</script></body></html>
